<div class="mb-4 p-8">
    <p-card>
        <div class="flex items-center justify-between mb-5">
            <fe-title title="VIAJES"></fe-title>
            <p-button label="Viaje" severity="info" class="ml-2" [routerLink]="'/viajes/formulario'" icon="pi pi-plus"
                size="small"></p-button>
        </div>
        <fe-dynamic-table [columns]="cols" [data]="viajes()" [loading]="viajes().length < 1"
            [totalRecords]="totalRegistros()" [paginator]="true" [lazy]="true"
            (lazyLoad)="onLazyLoad($event)"></fe-dynamic-table>

        <div class="mb-5 mt-3 flex justify-end">
            <p-button label="Regresar" severity="info" class="ml-2" [text]="true" [routerLink]="'/'"
                icon="pi pi-arrow-left" size="small"></p-button>
        </div>
    </p-card>
</div>
