<div class="shadow-md border-b border-gray-200 bg-white sticky top-0 z-50">

    <p-menubar [model]="items" styleClass="border-none px-4">
        <ng-template #start>

            <div
                class="flex items-center gap-3 cursor-pointer"
                routerLink="/">

                <div class="bg-blue-600 text-white rounded-xl p-2">

                    <i class="pi pi-truck text-xl"></i>

                </div>

                <div class="flex flex-col">

                    <span class="font-bold text-lg text-gray-800">
                        Despacho
                    </span>

                    <span class="text-xs text-gray-500">
                        Sistema Operativo
                    </span>

                </div>

            </div>

        </ng-template>
        
        <ng-template #end>

            <div class="flex items-center gap-4">

                <button
                    pButton
                    type="button"
                    icon="pi pi-bell"
                    [text]="true"
                    rounded>
                </button>

                <div class="flex items-center gap-3">

                    <p-avatar
                        label="EA"
                        shape="circle"
                        size="large">
                    </p-avatar>

                    <div class="hidden md:flex flex-col">

                        <span class="font-semibold text-sm">
                            Edgar Alba
                        </span>

                        <span class="text-xs text-gray-500">
                            Administrador
                        </span>

                    </div>

                </div>

            </div>

        </ng-template>

    </p-menubar>

</div>
